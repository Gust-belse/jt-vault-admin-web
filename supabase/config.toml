# Supabase CLI configuration for J&T Express KPI-DPGS Vault Admin
project_id = "kpi-dpgs-vault"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[auth]
enabled = true
enable_signup = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.admin-create-user]
verify_jwt = true
